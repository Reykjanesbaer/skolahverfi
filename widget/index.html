<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Skólahverfaleit Reykjanesbæjar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
  <!--
    Skólahverfaleit Reykjanesbæjar.
    Stillt með færibreytum í slóð, t.d.:
      widget/?theme=dark&radius=8&showSchools=0
    Sjá README fyrir allar stillingar. Græjan vistar engin heimilisföng og
    sendir ekkert frá sér: öll leit fer fram í vafranum.
  -->
  <main class="sk" id="sk" aria-labelledby="sk-title">
    <header class="sk-head" id="sk-head">
      <h1 class="sk-title" id="sk-title"></h1>
      <p class="sk-intro" id="sk-intro"></p>
    </header>

    <section class="sk-search" aria-label="Leit að heimilisfangi">
      <form id="sk-form" class="sk-form" role="search" autocomplete="off" novalidate>
        <label class="sk-label" for="sk-input">Heimilisfang</label>
        <div class="sk-field">
          <svg class="sk-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="sk-input" class="sk-input" type="text" role="combobox"
                 aria-autocomplete="list" aria-expanded="false" aria-controls="sk-list"
                 aria-describedby="sk-hint sk-error"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="search" maxlength="80" disabled>
          <button type="button" class="sk-clear" id="sk-clear" hidden aria-label="Hreinsa leit">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <ul class="sk-list" id="sk-list" role="listbox" aria-label="Tillögur að heimilisföngum" hidden></ul>
        <p class="sk-hint" id="sk-hint">Hleð heimilisföngum …</p>
        <p class="sk-error" id="sk-error" role="alert" hidden></p>
        <button type="button" class="sk-btn sk-retry" id="sk-retry" hidden>Reyna aftur</button>
      </form>
      <div class="sr-only" id="sk-status" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    <section class="sk-result-wrap" id="sk-result" aria-label="Niðurstaða"></section>

    <details class="sk-all" id="sk-all" hidden>
      <summary class="sk-all-summary"><span>Skoða öll skólahverfi</span></summary>
      <div class="sk-all-body" id="sk-all-body"></div>
    </details>

    <footer class="sk-foot" id="sk-foot"></footer>
  </main>

  <script src="core.js"></script>
  <script src="config.js"></script>
  <script src="widget.js"></script>
</body>
</html>
