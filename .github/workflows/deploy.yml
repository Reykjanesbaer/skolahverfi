# Birtir vefinn á GitHub Pages: https://reykjanesbaer.github.io/skolahverfi/
#   /            stjórnborð, forskoðun og kóðasmiður
#   /widget/     sjálfstæða skólahverfaleitin (iframe)
#   /embed.js    valfrjáls innfellingarskrifta
#
# Engin byggingarskref fyrir vefinn sjálfan (hreinar statískar skrár). Á
# undan birtingu keyra einingapróf og gagnasannprófun; ef þau falla er ekkert
# birt og síðasta útgáfa helst. Allar slóðir í kóðanum eru afstæðar, svo vefurinn
# virkar undir /skolahverfi/ án harðkóðaðrar rótar.
#
# EINU SINNI þarf að virkja Pages: Settings → Pages → Source: „GitHub Actions“.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein birting í einu; nýrri keyrsla bíður frekar en að hætta við.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run review:check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setja saman vefinn (fellur ef nauðsynlega skrá vantar)
        run: node scripts/build-site.js _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
