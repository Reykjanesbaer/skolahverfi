# TÍMABUNDIÐ — verður fjarlægt áður en PR er sameinað.
# Fyrsti innflutningur Staðfangaskrár á vinnugrein: sama ferli og
# update-hms-data.yml en skrifar niðurstöðuna beint á greinina (ekki PR),
# því workflow_dispatch er aðeins hægt að keyra þegar skráin er á main.
# Keyrir þegar þessi skrá breytist. (run: 2)
name: bootstrap-hms
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/bootstrap-hms.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sækja Staðfangaskrá
        id: dl
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 600 \
            -D "$RUNNER_TEMP/headers.txt" -o "$RUNNER_TEMP/Stadfangaskra.csv" \
            "https://hmsstgsftpprodweu001.blob.core.windows.net/fasteignaskra/Stadfangaskra.csv"
          size=$(stat -c %s "$RUNNER_TEMP/Stadfangaskra.csv")
          echo "Stærð: $size bæti"
          test "$size" -gt 5000000
          lm=$(grep -i '^last-modified:' "$RUNNER_TEMP/headers.txt" | tail -1 | sed 's/^[^:]*: *//' | tr -d '\r')
          echo "last_modified=$lm" >> "$GITHUB_OUTPUT"
      - name: Flytja inn
        run: |
          node scripts/import-hms.js --input "$RUNNER_TEMP/Stadfangaskra.csv" \
            --retrieved "$(date -u +%F)" --source-modified "${{ steps.dl.outputs.last_modified }}" \
            --summary "$RUNNER_TEMP/summary.md" | tee "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Sannprófa
        run: node scripts/validate-data.js
      - name: Skýrslur í logg
        run: |
          echo "=== hms-skyrsla.md ==="; head -c 12000 data/review/hms-skyrsla.md
          echo; echo "=== YFIRFERD.md ==="; head -c 40000 data/review/YFIRFERD.md
      - name: Athuga slóðir skóla
        run: node scripts/check-school-links.js
      - name: Vista á greinina
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widget/data data/review
          if git diff --cached --quiet; then echo "Engar breytingar"; else
            git commit -m "Fyrsti innflutningur Staðfangaskrár HMS (sjálfvirkt)"
            git push
          fi
