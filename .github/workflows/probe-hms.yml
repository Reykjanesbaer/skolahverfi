# TÍMABUNDIÐ könnunarworkflow: skrifar út snið Staðfangaskrár HMS í logginn
# (haus, skiltákn, stafakóðun, fjölda) svo innflutningsskriftan sé smíðuð eftir
# raunverulegu sniði. Verður fjarlægt áður en PR er sameinað.
name: probe-hms
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-hms.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sækja CSV
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -D headers.txt -o Stadfangaskra.csv \
            "https://hmsstgsftpprodweu001.blob.core.windows.net/fasteignaskra/Stadfangaskra.csv"
          cat headers.txt
          ls -l Stadfangaskra.csv
          file Stadfangaskra.csv
          head -c 700 Stadfangaskra.csv | head -3
      - name: Greina snið
        run: |
          python3 - <<'PY'
          import csv, io, collections
          raw = open('Stadfangaskra.csv','rb').read()
          print('BOM:', raw[:3] == b'\xef\xbb\xbf')
          for enc in ('utf-8-sig','cp1252'):
              try:
                  text = raw.decode(enc); print('encoding ok:', enc); break
              except UnicodeDecodeError: pass
          first = text.split('\n',1)[0]
          delim = max([',',';','|','\t'], key=first.count)
          print('delimiter:', repr(delim))
          rows = list(csv.DictReader(io.StringIO(text), delimiter=delim))
          print('columns:', list(rows[0].keys()))
          print('rows:', len(rows))
          sv = collections.Counter(r.get('SVFNR') or r.get('SVFN') for r in rows)
          print('SVFNR distinct:', len(sv))
          streets = ('Smáratún','Hafnargata','Tjarnargata','Klapparstígur','Faxabraut','Hringbraut','Akurbraut','Stapagata','Ásbrú')
          for r in rows:
              if r.get('HEITI_NF') in ('Smáratún','Hafnargata') and (r.get('HUSNR') in ('36','1')):
                  print('SAMPLE', {k: r[k] for k in r if k in ('HEINUM','SVFNR','BYGGD','HEITI_NF','HUSNR','BOKST','VIDSK','POSTNR','N_HNIT_WGS84','E_HNIT_WGS84')})
          cand = [r for r in rows if r.get('HEITI_NF') in ('Smáratún','Tjarnargata','Klapparstígur','Hringbraut','Faxabraut')]
          tab = collections.Counter((r['HEITI_NF'], r.get('SVFNR'), r.get('BYGGD'), r.get('POSTNR')) for r in cand)
          for k,v in sorted(tab.items()): print('STREET', k, v)
          rb = [r for r in rows if r.get('SVFNR') == '2000']
          print('SVFNR=2000 rows:', len(rb))
          print('SVFNR=2000 POSTNR:', collections.Counter(r.get('POSTNR') for r in rb))
          print('SVFNR=2000 BYGGD:', collections.Counter(r.get('BYGGD') for r in rb))
          print('SVFNR=2000 distinct streets:', len(set(r['HEITI_NF'] for r in rb)))
          print('BOKST values:', collections.Counter(r.get('BOKST') for r in rb).most_common(12))
          print('VIDSK values:', collections.Counter(r.get('VIDSK') for r in rb).most_common(12))
          print('empty HUSNR:', sum(1 for r in rb if not (r.get('HUSNR') or '').strip()))
          print('dup HEINUM in 2000:', len(rb) - len(set(r.get('HEINUM') for r in rb)))
          PY
